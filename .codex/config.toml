# PA-Explorer project-scoped Codex configuration.
# Loaded by Codex only when this repository is trusted.

project_doc_max_bytes = 65536
project_doc_fallback_filenames = []

developer_instructions = """
PA-Explorer Codex adaptation layer.

Use AGENTS.md as the canonical project entrypoint. It points to the neutral
project knowledge in docs/.

Do not duplicate canonical project rules here. This file is only the Codex
adapter.

Before touching code:
1. Read AGENTS.md.
2. Identify the task type.
3. Read the relevant files from docs/agent-rules/.
4. Read the relevant workflow from docs/skills/.
5. Use repo skills under .agents/skills/ when a task matches their descriptions.

Treat docs/agent-rules/*.md as the canonical project conventions.

Before changing Codex-specific files, check the official Codex documentation:
- https://developers.openai.com/codex/guides/agents-md
- https://developers.openai.com/codex/config-basic
- https://developers.openai.com/codex/config-advanced
- https://developers.openai.com/codex/config-reference
- https://developers.openai.com/codex/skills
- https://developers.openai.com/codex/subagents

Before reporting completion for any task, apply docs/skills/do_work.md. For
this project, final validation includes venv/bin/python -m pytest -q when
relevant. If pytest fails, diagnose the root cause instead of bypassing tests.

Do not modify app/ or tests/ unless the user's task explicitly asks for
application or test changes.
"""

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800
